<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1790 176" width="1790" height="176" color="#000000" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img">
  <title>The operating loop</title>
  <desc>Calendar to target list to room to follow-up to pipeline, with a dashed feedback edge from pipeline back to the target list marked as the step nobody runs today.</desc>
  <rect x="0" y="0" width="1790" height="176" fill="#FFFFFF"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="currentColor"/></marker></defs>
  <rect x="0" y="28" width="300" height="78" fill="#FFFFFF" stroke="currentColor" stroke-width="1.5"/><text x="20" y="60" font-size="17" font-weight="700" fill="currentColor">Calendar</text><text x="20" y="84" font-size="13" fill="#767676">17 P1 events, dated</text><rect x="370" y="28" width="300" height="78" fill="#FFFFFF" stroke="currentColor" stroke-width="1.5"/><text x="390" y="60" font-size="17" font-weight="700" fill="currentColor">Target list</text><text x="390" y="84" font-size="13" fill="#767676">219 named buyers</text><rect x="740" y="28" width="300" height="78" fill="#FFFFFF" stroke="currentColor" stroke-width="1.5"/><text x="760" y="60" font-size="17" font-weight="700" fill="currentColor">The room</text><text x="760" y="84" font-size="13" fill="#767676">brief, live demo, dinner</text><rect x="1110" y="28" width="300" height="78" fill="#FFFFFF" stroke="currentColor" stroke-width="1.5"/><text x="1130" y="60" font-size="17" font-weight="700" fill="currentColor">Follow-up</text><text x="1130" y="84" font-size="13" fill="#767676">inside the same week</text><rect x="1480" y="28" width="300" height="78" fill="#FFFFFF" stroke="currentColor" stroke-width="1.5"/><text x="1500" y="60" font-size="17" font-weight="700" fill="currentColor">Pipeline</text><text x="1500" y="84" font-size="13" fill="#767676">logged, named, costed</text><line x1="308" y1="67" x2="354" y2="67" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/><text x="331" y="18" font-size="10.5" font-weight="700" letter-spacing="0.09em" fill="#767676" text-anchor="middle">WHO TO SEAT</text><line x1="678" y1="67" x2="724" y2="67" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/><text x="701" y="18" font-size="10.5" font-weight="700" letter-spacing="0.09em" fill="#767676" text-anchor="middle">MEETINGS BOOKED</text><line x1="1048" y1="67" x2="1094" y2="67" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/><text x="1071" y="18" font-size="10.5" font-weight="700" letter-spacing="0.09em" fill="#767676" text-anchor="middle">CONVERSATIONS</text><line x1="1418" y1="67" x2="1464" y2="67" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/><text x="1441" y="18" font-size="10.5" font-weight="700" letter-spacing="0.09em" fill="#767676" text-anchor="middle">NAMED ACCOUNTS</text><path d="M 1630 106 L 1630 158 L 520 158 L 520 116" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#ar)"/><rect x="890" y="144" width="372" height="28" fill="#FFFFFF"/><text x="1076" y="163" font-size="12.5" font-weight="600" fill="currentColor" text-anchor="middle">Outcomes rewrite who gets targeted next</text>
