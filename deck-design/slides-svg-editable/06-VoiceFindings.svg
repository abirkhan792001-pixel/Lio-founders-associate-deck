  <text x="64.0" y="104.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="54.0" font-weight="700" fill="#000000" letter-spacing="-1.35" xml:space="preserve">One voice carries the category, and the customer wall is</text>
  <text x="64.0" y="162.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="54.0" font-weight="700" fill="#000000" letter-spacing="-1.35" xml:space="preserve">silent.</text>
  <text x="1821.2" y="84.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25.0" font-weight="600" fill="#2B2E30" letter-spacing="-0.38" xml:space="preserve">Lio</text>
  <text x="1767.5" y="106.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#767676" letter-spacing="0.99" xml:space="preserve">03 · FINDINGS</text>
  <text x="64.0" y="249.6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21.0" font-weight="400" fill="#767676" xml:space="preserve">60 indexed posts. Keil authors 40% of them, and customers author none.</text>
  <text x="64.0" y="305.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#000000" letter-spacing="1.25" xml:space="preserve">POSTS FOUND, BY WHO IS TALKING</text>
  <text x="64.0" y="353.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="600" fill="#000000" xml:space="preserve">Vladimir Keil (CEO)</text>
  <text x="64.0" y="372.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">the channel, effectively</text>
  <text x="746.0" y="362.6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="700" fill="#000000" xml:space="preserve">24</text>
  <text x="64.0" y="422.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="600" fill="#000000" xml:space="preserve">Lio company page</text>
  <text x="64.0" y="441.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">including the askLio era</text>
  <text x="496.0" y="431.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="700" fill="#000000" xml:space="preserve">9</text>
  <text x="64.0" y="491.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="600" fill="#000000" xml:space="preserve">Third-party commentary</text>
  <text x="64.0" y="510.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">analysts, influencers, reactions</text>
  <text x="496.0" y="500.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="700" fill="#000000" xml:space="preserve">9</text>
  <text x="64.0" y="560.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="600" fill="#000000" xml:space="preserve">Heinzmann and Wagner</text>
  <text x="64.0" y="579.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">CTO and COO</text>
  <text x="463.0" y="570.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="700" fill="#000000" xml:space="preserve">7</text>
  <text x="64.0" y="629.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="600" fill="#000000" xml:space="preserve">Lio team</text>
  <text x="64.0" y="648.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">Petras, new-hire posts, FDE Night</text>
  <text x="463.0" y="639.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="700" fill="#000000" xml:space="preserve">7</text>
  <text x="64.0" y="698.6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="600" fill="#000000" xml:space="preserve">Investors and network</text>
  <text x="64.0" y="717.6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">YC and a16z orbit</text>
  <text x="413.0" y="708.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="700" fill="#000000" xml:space="preserve">4</text>
  <text x="76.0" y="777.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="700" fill="#000000" xml:space="preserve">Customers</text>
  <text x="76.0" y="796.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">despite a 150+ enterprise logo wall</text>
  <text x="362.0" y="787.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="700" fill="#000000" xml:space="preserve">0 posts found</text>
  <text x="64.0" y="842.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">Found via search-engine indexing of linkedin.com, so this is a floor rather than a census. The login wall hides an unknown share of posts.</text>
  <text x="1066.9" y="329.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17.0" font-weight="700" fill="#000000" letter-spacing="-0.17" xml:space="preserve">One voice carries 40% of the channel</text>
  <text x="1066.9" y="356.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#767676" xml:space="preserve">Keil authors 24 of 60 indexed posts, and the founder team together 31. That is a single point of failure, and also</text>
  <text x="1066.9" y="377.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#767676" xml:space="preserve">the cheapest amplifier available. Founder-content ops multiplies an asset that already works.</text>
  <text x="1066.9" y="453.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17.0" font-weight="700" fill="#000000" letter-spacing="-0.17" xml:space="preserve">The logo wall is silent</text>
  <text x="1066.9" y="480.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#767676" xml:space="preserve">Zero customer-authored posts, despite award-grade stories at Schaeffler, REHAU and Surventis. Every go-live,</text>
  <text x="1066.9" y="502.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#767676" xml:space="preserve">award and dinner should ship with a co-marketing ask. Nobody owns that ask today.</text>
  <text x="1066.9" y="578.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17.0" font-weight="700" fill="#000000" letter-spacing="-0.17" xml:space="preserve">Moments, not a cadence</text>
  <text x="1066.9" y="605.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#767676" xml:space="preserve">Activity spikes at the YC launch, the BME award and the Series A, then goes quiet. The 17-room calendar is a</text>
  <text x="1066.9" y="626.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#767676" xml:space="preserve">built-in content engine if every room produces posts before, during and after. That loop needs an owner.</text>
  <text x="94.0" y="948.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="56.0" font-weight="700" fill="#000000" letter-spacing="-1.68" xml:space="preserve">60</text>
  <text x="94.0" y="975.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">DISTINCT POSTS</text>
  <text x="94.0" y="989.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">IN THE REGISTER</text>
  <text x="242.0" y="940.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="600" fill="#000000" xml:space="preserve">Share of voice is founder-heavy and customer-silent. That is an ops gap, not a budget gap, and the events to content to advocacy loop I would run closes it.</text>
  <text x="1445.8" y="940.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#2E2E28" xml:space="preserve">Full register with URLs, authors, dates and themes</text>
  <text x="242.0" y="964.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#2E2E28" xml:space="preserve">ships as 14-linkedin-posts.md.</text>
  <text x="64.0" y="1044.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9A9A9A" xml:space="preserve">Compiled via an 8-angle search sweep. Dates decoded from LinkedIn activity IDs. Logo count, awards and customer facts per the Lio site, newsroom and press, August 2026.</text>
  <text x="1667.9" y="1026.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#9A9A9A" letter-spacing="0.88" xml:space="preserve">KHAN.ABIRHILAL@GMAIL.COM</text>
  <text x="1824.7" y="1044.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#9A9A9A" letter-spacing="0.88" xml:space="preserve">6 / 11</text>
</svg>
