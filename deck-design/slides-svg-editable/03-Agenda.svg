  <g transform="translate(64.0 800.3) scale(1.0011)" ><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="currentColor"></path></marker></defs><rect x="0" y="28" width="300" height="78" fill="#FFFFFF" stroke="currentColor" stroke-width="1.5"></rect><text x="20" y="60" font-size="17" font-weight="700" fill="currentColor">Calendar</text><text x="20" y="84" font-size="13" fill="#767676">17 P1 events, dated</text><rect x="370" y="28" width="300" height="78" fill="#FFFFFF" stroke="currentColor" stroke-width="1.5"></rect><text x="390" y="60" font-size="17" font-weight="700" fill="currentColor">Target list</text><text x="390" y="84" font-size="13" fill="#767676">219 named buyers</text><rect x="740" y="28" width="300" height="78" fill="#FFFFFF" stroke="currentColor" stroke-width="1.5"></rect><text x="760" y="60" font-size="17" font-weight="700" fill="currentColor">The room</text><text x="760" y="84" font-size="13" fill="#767676">brief, live demo, dinner</text><rect x="1110" y="28" width="300" height="78" fill="#FFFFFF" stroke="currentColor" stroke-width="1.5"></rect><text x="1130" y="60" font-size="17" font-weight="700" fill="currentColor">Follow-up</text><text x="1130" y="84" font-size="13" fill="#767676">inside the same week</text><rect x="1480" y="28" width="300" height="78" fill="#FFFFFF" stroke="currentColor" stroke-width="1.5"></rect><text x="1500" y="60" font-size="17" font-weight="700" fill="currentColor">Pipeline</text><text x="1500" y="84" font-size="13" fill="#767676">logged, named, costed</text><line x1="308" y1="67" x2="354" y2="67" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"></line><text x="331" y="18" font-size="10.5" font-weight="700" letter-spacing="0.09em" fill="#767676" text-anchor="middle">WHO TO SEAT</text><line x1="678" y1="67" x2="724" y2="67" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"></line><text x="701" y="18" font-size="10.5" font-weight="700" letter-spacing="0.09em" fill="#767676" text-anchor="middle">MEETINGS BOOKED</text><line x1="1048" y1="67" x2="1094" y2="67" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"></line><text x="1071" y="18" font-size="10.5" font-weight="700" letter-spacing="0.09em" fill="#767676" text-anchor="middle">CONVERSATIONS</text><line x1="1418" y1="67" x2="1464" y2="67" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"></line><text x="1441" y="18" font-size="10.5" font-weight="700" letter-spacing="0.09em" fill="#767676" text-anchor="middle">NAMED ACCOUNTS</text><path d="M 1630 106 L 1630 158 L 520 158 L 520 116" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#ar)"></path><rect x="890" y="144" width="372" height="28" fill="#FFFFFF"></rect><text x="1076" y="163" font-size="12.5" font-weight="600" fill="currentColor" text-anchor="middle">Outcomes rewrite who gets targeted next</text></g>
  <text x="64.0" y="104.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="54.0" font-weight="700" fill="#000000" letter-spacing="-1.35" xml:space="preserve">The what, why and how.</text>
  <text x="1821.2" y="84.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25.0" font-weight="600" fill="#2B2E30" letter-spacing="-0.38" xml:space="preserve">Lio</text>
  <text x="1625.4" y="106.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#767676" letter-spacing="0.99" xml:space="preserve">FOUNDERS ASSOCIATE APPLICATION</text>
  <text x="64.0" y="191.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21.0" font-weight="400" fill="#767676" xml:space="preserve">How this deck is structured, and what I would drive once I join the team.</text>
  <text x="64.0" y="250.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#000000" letter-spacing="1.25" xml:space="preserve">HOW THE DECK IS STRUCTURED</text>
  <text x="64.0" y="302.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20.0" font-weight="700" fill="#BDBDBD" xml:space="preserve">01</text>
  <text x="114.0" y="302.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18.0" font-weight="600" fill="#000000" xml:space="preserve">Who buys Lio, sourced and counted</text>
  <text x="864.2" y="299.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="700" fill="#000000" letter-spacing="0.88" xml:space="preserve">FINDINGS</text>
  <text x="64.0" y="357.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20.0" font-weight="700" fill="#BDBDBD" xml:space="preserve">02</text>
  <text x="114.0" y="357.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18.0" font-weight="600" fill="#000000" xml:space="preserve">Where they gather, re-verified</text>
  <text x="864.2" y="354.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="700" fill="#000000" letter-spacing="0.88" xml:space="preserve">FINDINGS</text>
  <text x="64.0" y="412.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20.0" font-weight="700" fill="#BDBDBD" xml:space="preserve">03</text>
  <text x="114.0" y="412.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18.0" font-weight="600" fill="#000000" xml:space="preserve">What the market hears on LinkedIn</text>
  <text x="864.2" y="409.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="700" fill="#000000" letter-spacing="0.88" xml:space="preserve">FINDINGS</text>
  <text x="64.0" y="467.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20.0" font-weight="700" fill="#BDBDBD" xml:space="preserve">04</text>
  <text x="114.0" y="467.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18.0" font-weight="600" fill="#000000" xml:space="preserve">What I would own from day 0</text>
  <text x="858.1" y="464.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="700" fill="#FFFFFF" letter-spacing="0.88" xml:space="preserve">STRATEGY</text>
  <text x="64.0" y="522.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20.0" font-weight="700" fill="#BDBDBD" xml:space="preserve">05</text>
  <text x="114.0" y="522.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18.0" font-weight="600" fill="#000000" xml:space="preserve">Why hire me, and what you get back</text>
  <text x="856.0" y="519.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="700" fill="#FFFFFF" letter-spacing="0.88" xml:space="preserve">THE OFFER</text>
  <text x="64.0" y="577.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20.0" font-weight="700" fill="#BDBDBD" xml:space="preserve">06</text>
  <text x="114.0" y="577.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18.0" font-weight="600" fill="#000000" xml:space="preserve">What it costs, and what it returns</text>
  <text x="869.8" y="574.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="700" fill="#FFFFFF" letter-spacing="0.88" xml:space="preserve">THE ASK</text>
  <text x="90.0" y="654.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">THE SHORT VERSION</text>
  <text x="90.0" y="685.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#3C3C3C" xml:space="preserve">Three findings built from public sources before day 0, one machine to run them, and one ask priced against</text>
  <text x="90.0" y="709.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#3C3C3C" xml:space="preserve">what that machine returns.</text>
  <text x="1020.0" y="250.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#000000" letter-spacing="1.25" xml:space="preserve">WHAT I WOULD GO AFTER</text>
  <text x="1020.0" y="293.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">SHORT TERM</text>
  <text x="1020.0" y="324.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="600" fill="#000000" xml:space="preserve">Own event ops end to end for Q3 and Q4.</text>
  <text x="1342.8" y="324.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">Target lists per room, founder briefs, the sidecar dinners, and the</text>
  <text x="1020.0" y="348.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">next-day follow-ups nobody has time for.</text>
  <text x="1020.0" y="382.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="600" fill="#000000" xml:space="preserve">Stand up the outbound engine.</text>
  <text x="1262.8" y="382.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">Keep the named-buyer list alive in Apollo, feed sequences with the AEs, and</text>
  <text x="1020.0" y="406.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">report what converts.</text>
  <text x="1020.0" y="440.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="600" fill="#000000" xml:space="preserve">Give Keil and Wagner leverage.</text>
  <text x="1264.9" y="440.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">Prep, notes, pipeline hygiene and the analysis layer of the $10M Challenge.</text>
  <text x="1020.0" y="464.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">Founders get hours back, every week.</text>
  <text x="1020.0" y="530.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">LONG TERM</text>
  <text x="1020.0" y="561.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="600" fill="#000000" xml:space="preserve">Own a slice of the US field engine</text>
  <text x="1283.4" y="561.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">as the NYC pod scales. The Q2-27 calendar already requires a field-</text>
  <text x="1020.0" y="585.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">marketing layer.</text>
  <text x="1020.0" y="619.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="600" fill="#000000" xml:space="preserve">Run the displacement campaign end to end,</text>
  <text x="1363.3" y="619.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">from the SSOW and SIG rooms to qualified pilots. The 93%-</text>
  <text x="1020.0" y="643.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">cheaper story deserves its own funnel.</text>
  <text x="1020.0" y="677.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="600" fill="#000000" xml:space="preserve">Earn ownership of a revenue line,</text>
  <text x="1281.9" y="677.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">the way Lio defines new roles for its own customers.</text>
  <text x="64.0" y="773.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">THE MACHINE THOSE FINDINGS FEED</text>
  <text x="64.0" y="1000.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#767676" xml:space="preserve">Every step exists today. The dashed edge does not, which is why each renewal is argued from memory rather than from what the last room produced.</text>
  <text x="64.0" y="1044.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9A9A9A" xml:space="preserve">Structure follows the three themes set for this application: who I am and why Lio, what I would own from day 0, and why hire me.</text>
  <text x="1667.9" y="1026.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#9A9A9A" letter-spacing="0.88" xml:space="preserve">KHAN.ABIRHILAL@GMAIL.COM</text>
  <text x="1824.7" y="1044.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#9A9A9A" letter-spacing="0.88" xml:space="preserve">3 / 11</text>
