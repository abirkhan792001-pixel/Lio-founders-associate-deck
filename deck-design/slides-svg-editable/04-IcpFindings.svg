  <text x="694.0" y="458.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#000000" xml:space="preserve">Head of Procurement or Sourcing and Vendor Management.</text>
  <text x="1116.8" y="458.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#767676" xml:space="preserve">Compliance-heavy,</text>
