  <text x="64.0" y="249.6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21.0" font-weight="400" fill="#767676" xml:space="preserve">219 named buyers are ready for outbound. The renewal trigger behind them holds in FS and the US, and breaks in DACH.</text>
