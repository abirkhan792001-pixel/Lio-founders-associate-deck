  <text x="794.2" y="660.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#767676" xml:space="preserve">plus digitalisation leads. Works councils in the room from day one.</text>
  <text x="1290.0" y="660.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#000000" xml:space="preserve">Follow the Deutsche Bahn breadcrumb.</text>
  <text x="1569.4" y="660.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#767676" xml:space="preserve">Regulated buyers move on references</text>
  <text x="1290.0" y="682.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#767676" xml:space="preserve">and auditability.</text>
  <text x="94.0" y="834.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="62.0" font-weight="700" fill="#000000" letter-spacing="-1.86" xml:space="preserve">219</text>
  <text x="94.0" y="863.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">NAMED BUYERS</text>
  <text x="94.0" y="877.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">122 COMPANIES</text>
  <text x="240.8" y="825.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="600" fill="#000000" xml:space="preserve">The outbound cold-start problem is solved before day 0.</text>
  <text x="680.8" y="825.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#2E2E28" xml:space="preserve">Every contact carries title, company, location and LinkedIn URL. 193 carry verified work emails, including prospect CPOs at Allianz, Deutsche Bahn,</text>
  <text x="240.8" y="849.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#2E2E28" xml:space="preserve">E.ON, ServiceNow, Citi, Beiersdorf and Miele. Apollo identifies</text>
  <text x="713.3" y="849.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="600" fill="#000000" xml:space="preserve">2,245 titled buyers</text>
  <text x="863.8" y="849.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#2E2E28" xml:space="preserve">on the same filters, so the refill pool is documented and reusable.</text>
  <text x="90.0" y="951.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">H1 RADAR SWEEP</text>
  <text x="90.0" y="979.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="400" fill="#767676" xml:space="preserve">35 accounts swept for BPO and SSC evidence:</text>
  <text x="426.0" y="979.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="600" fill="#000000" xml:space="preserve">one true third-party procurement BPO</text>
  <text x="705.5" y="979.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="400" fill="#767676" xml:space="preserve">(Zurich-Genpact) plus one Accenture JV, 4 captive centres with a live change event, 16 stable captives, 9 clean controls.</text>
  <text x="1564.3" y="979.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="600" fill="#000000" xml:space="preserve">The DACH displacement target is</text>
  <text x="90.0" y="1002.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="600" fill="#000000" xml:space="preserve">the captive SSC, which has no renewal date,</text>
  <text x="414.8" y="1002.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="400" fill="#767676" xml:space="preserve">so the trigger there is a change event and the renewal-timed motion belongs to FS and the US.</text>
  <text x="64.0" y="1044.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9A9A9A" xml:space="preserve">Sourced via Apollo, 31 August 2026. Search totals are Apollo database counts, not TAM. Radar sweep and evidence grades per Lio_H1_Test_Scorecard.csv and 17-gtm-hypothesis-and-test-roadmap.md.</text>
