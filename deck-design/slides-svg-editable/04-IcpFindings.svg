  <text x="694.0" y="550.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#000000" xml:space="preserve">VP GBS, Head of P2P, GPOs.</text>
  <text x="897.3" y="550.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#767676" xml:space="preserve">A persona classic procurement marketing barely</text>
  <text x="694.0" y="572.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#767676" xml:space="preserve">reaches.</text>
  <text x="1290.0" y="550.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#000000" xml:space="preserve">Budget capture, and the segment where renewals actually concentrate.</text>
