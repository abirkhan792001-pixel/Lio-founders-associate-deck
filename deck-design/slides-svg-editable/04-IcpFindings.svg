  <text x="1290.0" y="572.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#767676" xml:space="preserve">renewal is a qualified opportunity with a price to beat by 93%.</text>
  <text x="64.0" y="661.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="700" fill="#000000" letter-spacing="-0.17" xml:space="preserve">DACH utilities and mobility</text>
