  <text x="1290.0" y="458.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#000000" xml:space="preserve">Where the real renewals sit.</text>
  <text x="1488.9" y="458.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#767676" xml:space="preserve">Zurich-Genpact, running since 2012, is the one</text>
  <text x="1290.0" y="480.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#767676" xml:space="preserve">confirmed third-party procurement BPO in 35 swept accounts.</text>
  <text x="64.0" y="551.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="700" fill="#000000" letter-spacing="-0.17" xml:space="preserve">US F500 GBS and BPO owners</text>
  <text x="64.0" y="574.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#767676" xml:space="preserve">The people who sign outsourcing renewals ·</text>
