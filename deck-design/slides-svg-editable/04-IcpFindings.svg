  <text x="544.0" y="377.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.0" font-weight="600" fill="#767676" letter-spacing="1.00" xml:space="preserve">ON THE LIST</text>
  <text x="694.0" y="348.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#000000" xml:space="preserve">CPO sponsors, COO or CFO signs</text>
  <text x="932.7" y="348.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#767676" xml:space="preserve">via the SSC and FTE line. Procurement</text>
  <text x="694.0" y="369.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#767676" xml:space="preserve">Excellence champions, CIO gatekeeps.</text>
  <text x="1290.0" y="348.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#000000" xml:space="preserve">Trust-first, German, in person, timed to a change event.</text>
  <text x="1682.6" y="348.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#767676" xml:space="preserve">The DACH trigger is the</text>
