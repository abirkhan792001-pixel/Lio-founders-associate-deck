  <g transform="translate(1785.2 61.5) scale(0.5625)" fill="none" stroke="#2B2E30" stroke-width="3.3" stroke-linecap="round"><path d="M 24.00 44.00 A 20 20 0 1 1 42.13 15.55"></path><path d="M 24.00 43.50 A 13.5 13.5 0 1 1 34.34 21.32"></path><path d="M 24.00 43.20 A 8 8 0 1 1 28.59 28.65"></path></g>
  <g transform="translate(64.0 748.3) scale(1.0011)" ><rect x="0" y="6" width="586" height="30" fill="#DBDBCD" stroke="none" stroke-width="1"></rect><text x="14" y="26" font-size="11.5" font-weight="700" letter-spacing="0.09em" fill="currentColor">DAYS 0-30 · RUN THE GAUNTLET</text><rect x="596" y="6" width="586" height="30" fill="#FFFFFF" stroke="currentColor" stroke-width="1"></rect><text x="610" y="26" font-size="11.5" font-weight="700" letter-spacing="0.09em" fill="currentColor">DAYS 31-60 · THE WEDGE QUARTER</text><rect x="1192" y="6" width="598" height="30" fill="#FFFFFF" stroke="currentColor" stroke-width="1"></rect><text x="1206" y="26" font-size="11.5" font-weight="700" letter-spacing="0.09em" fill="currentColor">DAYS 61-90 · MAKE IT BORING</text><line x1="0" y1="76" x2="1790" y2="76" stroke="currentColor" stroke-width="1.5"></line><line x1="413" y1="72" x2="413" y2="64" stroke="currentColor" stroke-width="1"></line><circle cx="413" cy="76" r="4" fill="#FFFFFF" stroke="currentColor" stroke-width="1.5"></circle><text x="413" y="58" font-size="12" fill="currentColor" text-anchor="middle">ProcureCon Köln</text><line x1="531" y1="72" x2="531" y2="64" stroke="currentColor" stroke-width="1"></line><circle cx="531" cy="76" r="4" fill="#FFFFFF" stroke="currentColor" stroke-width="1.5"></circle><text x="531" y="58" font-size="12" fill="currentColor" text-anchor="middle">ProcureCon Boston</text><line x1="1062" y1="72" x2="1062" y2="64" stroke="currentColor" stroke-width="1"></line><circle cx="1062" cy="76" r="4" fill="#FFFFFF" stroke="currentColor" stroke-width="1.5"></circle><text x="1062" y="58" font-size="12" fill="currentColor" text-anchor="middle">SIG Chicago</text><line x1="1514" y1="72" x2="1514" y2="64" stroke="currentColor" stroke-width="1"></line><circle cx="1514" cy="76" r="4" fill="#FFFFFF" stroke="currentColor" stroke-width="1.5"></circle><text x="1514" y="58" font-size="12" fill="currentColor" text-anchor="middle">SSOW Berlin</text><line x1="256" y1="80" x2="256" y2="90" stroke="currentColor" stroke-width="1"></line><circle cx="256" cy="76" r="4" fill="currentColor"></circle><text x="256" y="106" font-size="12" fill="currentColor" text-anchor="middle">SSON San Diego</text><line x1="433" y1="80" x2="433" y2="90" stroke="currentColor" stroke-width="1"></line><circle cx="433" cy="76" r="4" fill="currentColor"></circle><text x="433" y="106" font-size="12" fill="currentColor" text-anchor="middle">B&amp;B NYC</text><line x1="570" y1="80" x2="570" y2="90" stroke="currentColor" stroke-width="1"></line><circle cx="570" cy="76" r="4" fill="currentColor"></circle><text x="570" y="106" font-size="12" fill="currentColor" text-anchor="middle">DPW Amsterdam</text><line x1="1101" y1="80" x2="1101" y2="90" stroke="currentColor" stroke-width="1"></line><circle cx="1101" cy="76" r="4" fill="currentColor"></circle><text x="1101" y="106" font-size="12" fill="currentColor" text-anchor="middle">B&amp;B Munich</text><line x1="1534" y1="80" x2="1534" y2="90" stroke="currentColor" stroke-width="1"></line><circle cx="1534" cy="76" r="4" fill="currentColor"></circle><text x="1534" y="106" font-size="12" fill="currentColor" text-anchor="middle">BME Berlin</text><rect x="0" y="70" width="7" height="12" fill="currentColor"></rect><text x="0" y="106" font-size="11.5" font-weight="700" letter-spacing="0.09em" fill="#767676">DAY 0</text></g>
  <text x="64.0" y="104.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="54.0" font-weight="700" fill="#000000" letter-spacing="-1.35" xml:space="preserve">What I would own, and how I would ramp.</text>
  <text x="1821.2" y="84.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25.0" font-weight="600" fill="#2B2E30" letter-spacing="-0.38" xml:space="preserve">Lio</text>
  <text x="1761.9" y="106.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#767676" letter-spacing="0.99" xml:space="preserve">04 · STRATEGY</text>
  <text x="64.0" y="191.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21.0" font-weight="400" fill="#767676" xml:space="preserve">The machine between the founders and the pipeline: the list, the rooms, and the follow-through.</text>
  <text x="64.0" y="250.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#000000" letter-spacing="1.25" xml:space="preserve">WHERE I GO DEEP</text>
  <text x="90.0" y="309.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20.0" font-weight="700" fill="#000000" letter-spacing="-0.20" xml:space="preserve">Event operations</text>
  <text x="276.0" y="306.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="700" fill="#000000" letter-spacing="0.88" xml:space="preserve">DEEP</text>
  <text x="90.0" y="339.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">Target lists per room, founder briefs, the sidecar dinners, and the next-day follow-ups. 17 rooms and 10 dinners</text>
  <text x="90.0" y="363.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">currently have no owner below the founders.</text>
  <text x="90.0" y="418.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20.0" font-weight="700" fill="#000000" letter-spacing="-0.20" xml:space="preserve">Outbound engine</text>
  <text x="280.2" y="415.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="700" fill="#000000" letter-spacing="0.88" xml:space="preserve">DEEP</text>
  <text x="90.0" y="448.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">The 219-name list stays alive in Apollo, sequences run with the AEs, and every cohort gets a report on what</text>
  <text x="90.0" y="472.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">converted and what did not.</text>
  <text x="90.0" y="527.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20.0" font-weight="700" fill="#000000" letter-spacing="-0.20" xml:space="preserve">The H1 test</text>
  <text x="220.2" y="524.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="700" fill="#4A4A4A" letter-spacing="0.88" xml:space="preserve">COVER</text>
  <text x="90.0" y="557.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">Renewal Radar maintained, change events tracked, loss reasons logged. The hypothesis reaches its decision</text>
  <text x="90.0" y="581.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">gate with real data behind it.</text>
  <text x="90.0" y="636.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20.0" font-weight="700" fill="#000000" letter-spacing="-0.20" xml:space="preserve">Founder leverage</text>
  <text x="281.1" y="633.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="700" fill="#4A4A4A" letter-spacing="0.88" xml:space="preserve">COVER</text>
  <text x="90.0" y="666.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">Prep, notes, pipeline hygiene, and the analysis layer of the $10M Challenge. Hours back for Keil and Wagner,</text>
  <text x="90.0" y="690.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">every week.</text>
  <text x="1020.0" y="250.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#000000" letter-spacing="1.25" xml:space="preserve">THE RAMP</text>
  <text x="1020.0" y="295.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">DAYS 0-30</text>
  <text x="1020.0" y="325.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20.0" font-weight="700" fill="#000000" letter-spacing="-0.20" xml:space="preserve">Run the gauntlet.</text>
  <text x="1020.0" y="354.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">Four P1 events plus Bots &amp; Buyers NYC in 18 days across two continents, starting in two weeks. The buyer list</text>
  <text x="1020.0" y="378.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">goes into sequences before the first flight.</text>
  <text x="1020.0" y="428.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">DAYS 31-60</text>
  <text x="1020.0" y="458.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20.0" font-weight="700" fill="#000000" letter-spacing="-0.20" xml:space="preserve">Work the wedge quarter.</text>
  <text x="1020.0" y="487.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">Berlin double-week and SIG Chicago, the rooms where the budget owners sit: third-party BPO in the US and</text>
  <text x="1020.0" y="511.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">FS rooms, captive SSC and GBS heads in the DACH ones. First outbound-cohort report ships.</text>
  <text x="1020.0" y="561.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">DAYS 61-90</text>
  <text x="1020.0" y="591.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20.0" font-weight="700" fill="#000000" letter-spacing="-0.20" xml:space="preserve">Make it boring.</text>
  <text x="1020.0" y="620.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">Calendar to list to room to follow-up to pipeline, measured weekly and running without heroics. The Q1-27 US</text>
  <text x="1020.0" y="644.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#767676" xml:space="preserve">quarter starts planned, staffed and booked early instead of rushed.</text>
  <text x="64.0" y="723.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">THE RAMP, AGAINST THE DATES THAT DO NOT MOVE</text>
  <text x="64.0" y="884.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#767676" xml:space="preserve">The first thirty days are not onboarding. Five rooms land inside them, and two early-bird deadlines close on 30 September.</text>
  <text x="90.0" y="922.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">THIS IS A PROPOSAL, NOT AN AUDIT</text>
  <text x="90.0" y="949.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="400" fill="#767676" xml:space="preserve">I do not know your internal pipeline, your pricing mechanics, or what the AEs are already running. Every priority here can be reordered in week one.</text>
  <text x="64.0" y="1044.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9A9A9A" xml:space="preserve">Agent roster and the 85% claim per lio.ai/product, company-reported. Event figures per the P1 budget plan.</text>
  <text x="1667.9" y="1026.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#9A9A9A" letter-spacing="0.88" xml:space="preserve">KHAN.ABIRHILAL@GMAIL.COM</text>
  <text x="1825.3" y="1044.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#9A9A9A" letter-spacing="0.88" xml:space="preserve">7 / 11</text>
</svg>
