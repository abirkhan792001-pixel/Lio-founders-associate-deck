  <text x="64.0" y="104.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="54.0" font-weight="700" fill="#000000" letter-spacing="-1.35" xml:space="preserve">The rooms are picked and the dates hold. The programme</text>
  <text x="64.0" y="162.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="54.0" font-weight="700" fill="#000000" letter-spacing="-1.35" xml:space="preserve">needs one owner.</text>
  <text x="1821.2" y="84.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25.0" font-weight="600" fill="#2B2E30" letter-spacing="-0.38" xml:space="preserve">Lio</text>
  <text x="1767.6" y="106.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#767676" letter-spacing="0.99" xml:space="preserve">02 · FINDINGS</text>
  <text x="64.0" y="249.6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21.0" font-weight="400" fill="#767676" xml:space="preserve">€929K and 204 staff-days across 17 events, with four starting in two weeks and no single owner below the founders.</text>
  <text x="400.1" y="308.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF" letter-spacing="1.15" xml:space="preserve">Q3-2026 · IN 2 WEEKS</text>
  <text x="843.2" y="308.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF" letter-spacing="1.15" xml:space="preserve">Q4-2026</text>
  <text x="1243.0" y="308.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3C3C3C" letter-spacing="1.15" xml:space="preserve">Q1-2027</text>
  <text x="1639.8" y="308.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3C3C3C" letter-spacing="1.15" xml:space="preserve">Q2-2027</text>
  <text x="64.0" y="365.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="700" fill="#000000" letter-spacing="-0.16" xml:space="preserve">The gauntlet runs</text>
  <text x="64.0" y="388.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">4 P1 events plus Bots &amp; Buyers</text>
  <text x="64.0" y="406.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">NYC. 18 days, 2 continents.</text>
  <text x="299.0" y="370.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#FFFFFF" xml:space="preserve">SSON San Diego · Sep 14-17</text>
  <text x="299.0" y="409.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#000000" xml:space="preserve">+ Bots &amp; Buyers NYC · Sep 23 (own)</text>
  <text x="299.0" y="448.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#FFFFFF" xml:space="preserve">ProcureCon EU Köln · Sep 22-24</text>
  <text x="299.0" y="487.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#FFFFFF" xml:space="preserve">ProcureCon East Boston · Sep 28-30 · lead</text>
  <text x="299.0" y="527.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#FFFFFF" xml:space="preserve">DPW Amsterdam · Sep 30-Oct 1</text>
  <text x="697.0" y="370.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#000000" xml:space="preserve">SIG Fall Chicago · Oct 25-28 · Petras</text>
  <text x="697.0" y="409.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#000000" xml:space="preserve">SSOW DACH Berlin · Nov 17-19</text>
  <text x="697.0" y="448.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#000000" xml:space="preserve">BME-Symposium Berlin · Nov 18-19</text>
  <text x="686.0" y="482.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">Berlin double-week holds. B&amp;B EU Munich collides with SIG</text>
  <text x="686.0" y="500.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">Chicago.</text>
  <text x="742.1" y="500.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#000000" xml:space="preserve">Split settled: Petras to Chicago, Keil and Wagner to</text>
  <text x="686.0" y="519.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#000000" xml:space="preserve">Munich,</text>
  <text x="739.4" y="519.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">conditional on SIG scheduling the buy-side session</text>
  <text x="686.0" y="537.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">Oct 25-26.</text>
  <text x="1095.0" y="370.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#3C3C3C" xml:space="preserve">ProcureCon West Vegas · Mar 8-10</text>
  <text x="1095.0" y="409.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#3C3C3C" xml:space="preserve">SSOW Orlando · Mar 8-11 · BPO keynote</text>
  <text x="1095.0" y="448.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#3C3C3C" xml:space="preserve">APC · Mar 22-24 · now New Orleans</text>
  <text x="1084.0" y="482.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">Same-week collision resolved: Keil to Orlando, Petras to Vegas.</text>
  <text x="1493.0" y="370.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#3C3C3C" xml:space="preserve">Handelsblatt Apr 6-7 · Gartner May 3-5</text>
  <text x="1493.0" y="409.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#3C3C3C" xml:space="preserve">eLösungstage May 11-12 · WPC May 18-20</text>
  <text x="1493.0" y="448.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#3C3C3C" xml:space="preserve">DPW NY Jun 2-3 · Proc. Summit Jun 23-24</text>
  <text x="1482.0" y="482.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">7 events. Breaks the current team without the Jan-27 field-</text>
  <text x="1482.0" y="500.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">marketing hire.</text>
  <text x="341.3" y="589.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">€165K new + €70K committed · 65 staff-days</text>
  <text x="750.5" y="589.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">€87K · 32 staff-days · cheapest, sharpest</text>
  <text x="1152.1" y="589.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">€108K + €35K committed · 31 staff-days</text>
  <text x="1547.5" y="589.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#767676" xml:space="preserve">€376K · 76 staff-days · the heavy quarter</text>
  <text x="90.0" y="649.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">STATUS CHECK, SIX WEEKS AFTER THE PLAN WAS WRITTEN</text>
  <text x="90.0" y="677.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="400" fill="#767676" xml:space="preserve">All four gauntlet dates hold. New since the plan:</text>
  <text x="432.6" y="677.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="600" fill="#000000" xml:space="preserve">Bots &amp; Buyers went transatlantic.</text>
  <text x="676.3" y="677.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="400" fill="#767676" xml:space="preserve">NYC Sep 23 lands mid-gauntlet and the EU flagship Oct 27-28 collides with SIG Chicago, now settled. APC 2027 moved to</text>
  <text x="1547.3" y="677.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="600" fill="#000000" xml:space="preserve">New Orleans</text>
  <text x="1640.4" y="677.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="400" fill="#767676" xml:space="preserve">. The NAPES move to</text>
  <text x="90.0" y="699.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="400" fill="#767676" xml:space="preserve">Denver is</text>
  <text x="160.8" y="699.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="600" fill="#000000" xml:space="preserve">unverified,</text>
  <text x="243.3" y="699.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="400" fill="#767676" xml:space="preserve">so hold the €35K. Two early-birds close</text>
  <text x="530.1" y="699.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="600" fill="#000000" xml:space="preserve">Sep 30.</text>
  <text x="64.0" y="796.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="52.0" font-weight="700" fill="#000000" letter-spacing="-1.56" xml:space="preserve">17</text>
  <text x="64.0" y="823.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">P1 EVENTS</text>
  <text x="64.0" y="837.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">Q3-26 TO Q2-27</text>
  <text x="236.2" y="790.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="600" fill="#000000" xml:space="preserve">€736K new plus €105K committed plus contingency, about €929K. 204 staff-days. 10 sidecar dinners, €120K of the total and the line to protect last.</text>
  <text x="236.2" y="814.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#3C3C3C" xml:space="preserve">The 17 verified customers cluster at</text>
  <text x="510.0" y="814.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="600" fill="#000000" xml:space="preserve">€2.8-4.7B revenue and 8-30K staff,</text>
  <text x="789.5" y="814.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="400" fill="#3C3C3C" xml:space="preserve">exactly the German practitioner fairs' demographic. The US circuit aims a tier higher against zero verified US customers.</text>
  <text x="64.0" y="908.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">SPONSOR · THE CPO</text>
  <text x="64.0" y="935.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#767676" xml:space="preserve">Handelsblatt, WPC, DPW and the dinners. Owns the mandate</text>
  <text x="64.0" y="956.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#767676" xml:space="preserve">and converts in closed rooms.</text>
  <text x="522.0" y="908.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">ECONOMIC BUYER · COO OR CFO</text>
  <text x="522.0" y="935.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#767676" xml:space="preserve">SSOW three times, SIG, SSON San Diego. Signs when the BPO</text>
  <text x="522.0" y="956.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#767676" xml:space="preserve">or FTE line moves.</text>
  <text x="980.0" y="908.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">CHAMPION · PROCUREMENT EXCELLENCE</text>
  <text x="980.0" y="935.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#767676" xml:space="preserve">The German BME fairs. Runs the evaluation and the pilot.</text>
  <text x="1438.0" y="908.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" letter-spacing="1.15" xml:space="preserve">GATEKEEPER · CIO OR CISO</text>
  <text x="1438.0" y="935.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#767676" xml:space="preserve">BME IT-Sourcing, SAP Connect, Gartner. Cannot say yes, can</text>
  <text x="1438.0" y="956.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#767676" xml:space="preserve">say no.</text>
  <text x="64.0" y="992.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.0" font-weight="600" fill="#000000" xml:space="preserve">The buying committee has four seats and no single event reaches more than two.</text>
  <text x="616.8" y="992.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#767676" xml:space="preserve">Preparation differs per seat, which is what the T-7 brief is for.</text>
  <text x="64.0" y="1044.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9A9A9A" xml:space="preserve">Figures from the Lio P1 budget and staffing plan, July 2026, mid-range estimates. Dates re-verified against organiser sources on 31 August 2026. Seat map per 20-event-strategy-and-icp-baseline.md.</text>
  <text x="1667.9" y="1026.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#9A9A9A" letter-spacing="0.88" xml:space="preserve">KHAN.ABIRHILAL@GMAIL.COM</text>
  <text x="1825.0" y="1044.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#9A9A9A" letter-spacing="0.88" xml:space="preserve">5 / 11</text>
