  <!-- ==================== RIGHT: THE FINDING ==================== -->
  <g id="finding">
    <rect x="640" y="648" width="1216" height="118" fill="#EDF2F1"/>
    <rect x="640" y="648" width="5" height="118" fill="#D7F452"/>
    <text class="mono lbl" x="672" y="682">THE FINDING</text>
    <text class="stat" x="672" y="726">US GBS holds half the money and no proven customer.</text>
    <text class="bodym" x="672" y="752">DACH Industrial holds 14% of it and every proven customer Lio has. €54.6M of the €75.9M sits in two segments with zero closed deals between them.</text>
  </g>

  <!-- ==================== RIGHT: MODEL COMPARISON ==================== -->
  <g id="model-check">
    <text class="mono lbl" x="640" y="820">05 · WHY NOT A FLAT % OF REVENUE</text>
    <line x1="640" y1="834" x2="1240" y2="834" stroke="#C7D2D1" stroke-width="1"/>

    <text class="mono lblm" x="640"  y="862">SEGMENT</text>
    <text class="mono lblm" x="1090" y="862" text-anchor="end">FLAT %</text>
    <text class="mono lblm" x="1240" y="862" text-anchor="end">LADDER (USED)</text>

    <text class="body" x="640"  y="890">US GBS &amp; BPO Owners</text>
    <text class="num"  x="1090" y="890" text-anchor="end">77.0%</text>
    <text class="numb" x="1240" y="890" text-anchor="end">51.9%</text>

    <text class="body" x="640"  y="918">Utilities &amp; Mobility</text>
    <text class="num"  x="1090" y="918" text-anchor="end">10.2%</text>
    <text class="numb" x="1240" y="918" text-anchor="end">20.0%</text>

    <text class="body" x="640"  y="946">DACH Industrial</text>
    <text class="num"  x="1090" y="946" text-anchor="end">3.4%</text>
    <text class="numb" x="1240" y="946" text-anchor="end">14.2%</text>

    <text class="body" x="640"  y="974">Insurance &amp; FS</text>
    <text class="num"  x="1090" y="974" text-anchor="end">9.4%</text>
    <text class="numb" x="1240" y="974" text-anchor="end">14.0%</text>

    <line x1="640" y1="994" x2="1240" y2="994" stroke="#C7D2D1" stroke-width="1"/>
    <text class="small" x="640" y="1016">A flat % of revenue just reproduces the revenue split and assumes</text>
    <text class="small" x="640" y="1034">Apple pays 100× what TRUMPF pays. The ladder is the defensible one.</text>
  </g>

