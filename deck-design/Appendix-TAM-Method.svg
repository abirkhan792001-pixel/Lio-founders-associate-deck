    <line x1="64" y1="86" x2="1856" y2="86" stroke="#0B1416" stroke-width="1.5"/>
    <text class="h1" x="64" y="150">How the €76M was calculated</text>
    <text class="sub" x="64" y="184">Every number on the ICP slide, with the arithmetic shown and the assumptions named.</text>
  </g>

