    <line x1="64" y1="756" x2="584" y2="756" stroke="#C7D2D1" stroke-width="1"/>
    <text class="small" x="64" y="780">Anchored to Lio's own model in 08-strategic-value-levers.md:</text>
    <text class="small" x="64" y="798">a 120-FTE case yields €7–9M of savings; Lio captures 10–20%</text>
    <text class="small" x="64" y="816">of it, which is the €0.7–1.8M "7-figure ACV" the file infers.</text>
    <text class="small" x="64" y="834">The ladder flattens at the top because enterprise ACV does.</text>
  </g>

