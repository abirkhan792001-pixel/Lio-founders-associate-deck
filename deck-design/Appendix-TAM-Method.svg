    <text class="small" x="1300" y="1006">SCHOTT is a confirmed customer. The list is ~95% net-new.</text>
    <text class="small" x="1300" y="1024">Deduct SCHOTT (€250K) for a pure-acquisition TAM: €75.67M.</text>
  </g>

