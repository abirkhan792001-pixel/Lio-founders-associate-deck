<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Inter, sans-serif">

  <!-- ============================================================
       SLIDE 08 · THE ASK  ·  1920x1080
       Inter only. Deck colour system: black/grey on white,
       sage #D6DBC5 accent, grey chips and panel.
       Simplified: three scenarios reduced to one idea each
       (works nowhere / in one segment / in both).
       Salary EUR 70-80K, anchor 75K -> base 18x, confirm 32x.
       All text live <text>. Fully editable.
       ============================================================ -->
  <style>
    text       { fill: #111111; }
    .tag       { font-size: 13px; letter-spacing: 1.6px; fill: #6E6E6E; font-weight: 600; }
    .h1        { font-size: 52px; font-weight: 700; letter-spacing: -1px; }
    .sub       { font-size: 16.5px; fill: #6E6E6E; }
    .seclbl    { font-size: 11px; letter-spacing: 1.4px; font-weight: 700; }
    .arr       { font-size: 46px; font-weight: 800; letter-spacing: -1.5px; }
    .chip      { font-size: 10.5px; letter-spacing: 1.2px; font-weight: 700; }
    .scenh     { font-size: 18px; font-weight: 700; }
    .scensub   { font-size: 13.5px; fill: #6E6E6E; }
    .askbig    { font-size: 58px; font-weight: 800; letter-spacing: -2px; }
    .askmeta   { font-size: 12px; letter-spacing: 1.2px; font-weight: 600; fill: #4A4A4A; }
    .askline   { font-size: 14px; fill: #1A1A1A; }
    .askrat    { font-size: 12.5px; fill: #4A4A4A; }
    .mult      { font-size: 84px; font-weight: 800; letter-spacing: -3px; }
    .multlbl   { font-size: 12px; letter-spacing: 1.2px; font-weight: 700; }
    .multsub   { font-size: 13.5px; fill: #4A4A4A; }
    .panh      { font-size: 11px; letter-spacing: 1.3px; font-weight: 700; }
    .panb      { font-size: 14px; fill: #3A3A3A; }
    .foot      { font-size: 11.5px; fill: #6E6E6E; letter-spacing: 0.3px; }
  </style>

  <rect id="bg" width="1920" height="1080" fill="#FFFFFF"/>

  <!-- ==================== HEADER ==================== -->
  <g id="header">
    <text class="h1" x="76" y="96">The base case returns the salary</text>
    <text class="h1" x="76" y="156">eighteen times over.</text>

    <g id="brand" transform="translate(1774,44)">
      <g fill="none" stroke="#111111" stroke-width="3.4" stroke-linecap="round">
        <path d="M 17 37 A 17 17 0 1 1 32.4 12.2"/>
        <path d="M 17 36.6 A 11.5 11.5 0 1 1 25.8 18.1"/>
        <path d="M 17 36.3 A 6.8 6.8 0 1 1 20.9 24.3"/>
      </g>
      <text x="46" y="30" font-size="24" font-weight="500" letter-spacing="-0.5">Lio</text>
    </g>
    <text class="tag" x="1844" y="104" text-anchor="end">08 · THE ASK</text>

    <line x1="76" y1="196" x2="1844" y2="196" stroke="#111111" stroke-width="1.5"/>
    <text class="sub" x="76" y="232">What I would return in year one, and what I cost.</text>
  </g>

  <!-- ==================== LEFT: THREE SCENARIOS ==================== -->
  <g id="scenarios">
    <text class="seclbl" x="76" y="298">YEAR-ONE ARR — THREE SCENARIOS</text>
    <line x1="76" y1="312" x2="1090" y2="312" stroke="#DADADA" stroke-width="1"/>

    <!-- KILL -->
    <text class="arr" x="76" y="418">€0–175K</text>
    <rect x="380" y="386" width="62" height="24" rx="4" fill="#E4E4E0"/>
    <text class="chip" x="411" y="402" text-anchor="middle">KILL</text>
    <text class="scenh" x="380" y="440">The thesis works nowhere.</text>
    <text class="scensub" x="380" y="466">Nothing converts. I rotate to the next hypothesis.</text>
    <line x1="76" y1="500" x2="1090" y2="500" stroke="#EDEDED" stroke-width="1"/>

    <!-- BASE -->
    <text class="arr" x="76" y="588">€1.35M</text>
    <rect x="380" y="556" width="96" height="24" rx="4" fill="#D6DBC5"/>
    <text class="chip" x="428" y="572" text-anchor="middle">BASE CASE</text>
    <text class="scenh" x="380" y="610">It works in financial services only.</text>
    <text class="scensub" x="380" y="636">2 insurer wins at €500K, plus 2 German wins at €175K.</text>
    <line x1="76" y1="670" x2="1090" y2="670" stroke="#EDEDED" stroke-width="1"/>

    <!-- CONFIRM -->
    <text class="arr" x="76" y="758">€2.4M</text>
    <rect x="380" y="726" width="86" height="24" rx="4" fill="#111111"/>
    <text class="chip" x="423" y="742" text-anchor="middle" fill="#FFFFFF">CONFIRM</text>
    <text class="scenh" x="380" y="780">It works in both.</text>
    <text class="scensub" x="380" y="806">3 insurer and 5 German wins. The account list doubles.</text>
  </g>

  <!-- ==================== RIGHT: THE ASK ==================== -->
  <g id="ask">
    <text class="seclbl" x="1180" y="298">THE ASK</text>
    <line x1="1180" y1="312" x2="1844" y2="312" stroke="#DADADA" stroke-width="1"/>

    <rect x="1180" y="348" width="664" height="304" fill="#D6DBC5"/>

    <text class="askbig" x="1212" y="434">€70–80K</text>
    <text class="askmeta" x="1212" y="464">BASE, YEAR ONE · ANCHOR €75K</text>

    <text class="askline" x="1212" y="506">Plus 0.05–0.15% equity. Four-year vest, one-year cliff.</text>
    <text class="askline" x="1212" y="538">Re-rated twice: at day 90, and at the decision gate</text>
    <text class="askline" x="1212" y="560">in early 2027.</text>

    <line x1="1212" y1="592" x2="1812" y2="592" stroke="#B9BFA9" stroke-width="1"/>

    <text class="askrat" x="1212" y="620">Munich and Berlin founders-associate roles pay €51–90K.</text>
    <text class="askrat" x="1212" y="640">This sits in the upper half. A proposed anchor, not a demand.</text>

    <!-- the multiple -->
    <text class="mult" x="1180" y="778">18×</text>
    <text class="multlbl" x="1386" y="736">BASE CASE OVER YEAR-ONE SALARY</text>
    <text class="multsub" x="1386" y="766">Confirm returns 32×.</text>
    <text class="multsub" x="1386" y="790">Kill returns almost nothing — which is</text>
    <text class="multsub" x="1386" y="812">exactly what a test is for.</text>
  </g>

  <!-- ==================== WHAT MOVES IT ==================== -->
  <g id="drivers">
    <rect x="76" y="866" width="1768" height="92" fill="#EDEFEA"/>
    <text class="panh" x="108" y="900">WHAT MOVES THESE NUMBERS</text>
    <text class="panb" x="108" y="932">The price per win (7% of what the old provider costs)  ·  how far the account list scales (35 → 75)  ·  which segment converts — one insurer win is worth about three German ones.</text>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g id="footer">
    <line x1="76" y1="1016" x2="1844" y2="1016" stroke="#DADADA" stroke-width="1"/>
    <text class="foot" x="76" y="1040">MODELLED, NOT FORECAST · ACV ≈ 7% OF DISPLACED BPO/SSC COST · KILL AND CONFIRM THRESHOLDS PER THE H1 TEST PLAN · SALARY PER GLASSDOOR MUNICH &amp; BERLIN, 2026</text>
    <text class="foot" x="1844" y="1040" text-anchor="end">8 / 11</text>
  </g>

</svg>
