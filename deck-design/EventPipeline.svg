  <!-- ==================== THE FINDING (black tick, no fill) ==================== -->
  <g id="finding">
    <line x1="76" y1="784" x2="1844" y2="784" stroke="#111111" stroke-width="1.5"/>
    <rect x="76" y="812" width="6" height="104" fill="#111111"/>

    <text class="seclbl" x="112" y="832">THE FINDING</text>
    <text class="stat" x="112" y="872">57% of the event spend chases the U.S. — the segment with no proven customer.</text>
    <text class="body" x="112" y="900">The calendar mirrors the TAM: the U.S. holds 52% of the addressable ARR and the most spend, yet it is the one</text>
