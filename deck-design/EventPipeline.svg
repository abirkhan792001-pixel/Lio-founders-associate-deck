<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- ============================================================
       SLIDE 05 · FINDINGS 02 — EVENT PIPELINE  ·  1920x1080
       Light system, matched to slide 04 (IcpFindings, light rev).
       Palette: ink #0B1416 · muted #7E9290 · rule #C7D2D1
                panel #EDF2F1 · sage band #D6DBC5 · accent #D7F452
       All text live <text>. Bars are <rect>. Edit directly.
       ============================================================ -->
  <style>
    .mono   { font-family: 'Geist Mono', 'Roboto Mono', Consolas, monospace; }
    .tag    { font-size: 13px; letter-spacing: 1.4px; fill: #7E9290; font-weight: 500; }
    .h1     { font-size: 52px; font-weight: 700; fill: #0B1416; letter-spacing: -1px; }
    .sub    { font-size: 16.5px; fill: #7E9290; }
    .kpibig { font-size: 44px; font-weight: 800; fill: #0B1416; letter-spacing: -1.5px; }
    .kpilbl { font-size: 11px; letter-spacing: 1.1px; fill: #7E9290; font-weight: 600; }
    .kpisub { font-size: 12.5px; fill: #0B1416; }
    .seclbl { font-size: 11px; letter-spacing: 1.4px; fill: #0B1416; font-weight: 700; }
    .barlbl { font-size: 15px; font-weight: 700; fill: #0B1416; }
    .barsub { font-size: 12px; fill: #7E9290; }
    .barval { font-size: 15px; font-weight: 700; fill: #0B1416; }
    .body   { font-size: 13.5px; fill: #0B1416; }
    .bodym  { font-size: 13.5px; fill: #7E9290; }
    .stat   { font-size: 26px; font-weight: 700; fill: #0B1416; letter-spacing: -0.5px; }
    .small  { font-size: 12px; fill: #7E9290; }
    .foot   { font-size: 11.5px; fill: #7E9290; }
  </style>

  <rect id="bg" width="1920" height="1080" fill="#FFFFFF"/>

  <!-- ==================== HEADER ==================== -->
  <g id="header">
    <text class="mono tag" x="76" y="60">02 · FINDINGS — WHERE THEY GATHER</text>
    <!-- Lio logo top-right -->
    <g transform="translate(1786,40)">
      <g fill="none" stroke="#0B1416" stroke-width="3.4" stroke-linecap="round">
        <path d="M 17 37 A 17 17 0 1 1 32.4 12.2"/>
        <path d="M 17 36.6 A 11.5 11.5 0 1 1 25.8 18.1"/>
        <path d="M 17 36.3 A 6.8 6.8 0 1 1 20.9 24.3"/>
      </g>
      <text x="46" y="30" font-size="24" font-weight="500" fill="#0B1416" letter-spacing="-0.5">Lio</text>
    </g>

    <text class="h1" x="76" y="128">Where they gather.</text>
    <text class="h1" x="76" y="188">The €929K bet to be in the room.</text>
    <line x1="76" y1="214" x2="1844" y2="214" stroke="#0B1416" stroke-width="1.5"/>
    <text class="sub" x="76" y="248">One P1 calendar: 17 events, four quarters. Where the spend goes shows which buyer Lio is really chasing.</text>
  </g>

  <!-- ==================== KPI TILES ==================== -->
  <g id="kpis">
    <!-- tile 1 -->
    <rect x="76"   y="278" width="425" height="118" fill="#EDF2F1"/>
    <text class="kpibig" x="104" y="342">17</text>
    <text class="mono kpilbl" x="104" y="366">P1 EVENTS · Q3-26 → Q2-27</text>
    <text class="kpisub" x="104" y="386">16 must-own + 1 committed renewal</text>

    <!-- tile 2 -->
    <rect x="524"  y="278" width="425" height="118" fill="#EDF2F1"/>
    <text class="kpibig" x="552" y="342">€929K</text>
    <text class="mono kpilbl" x="552" y="366">PROGRAM ENVELOPE</text>
    <text class="kpisub" x="552" y="386">€736K new + €105K committed + €88K buffer</text>

    <!-- tile 3 -->
    <rect x="972"  y="278" width="425" height="118" fill="#EDF2F1"/>
    <text class="kpibig" x="1000" y="342">204</text>
    <text class="mono kpilbl" x="1000" y="366">ON-SITE STAFF-DAYS</text>
    <text class="kpisub" x="1000" y="386">+30% prep ≈ 1.2 full-time people for a year</text>

    <!-- tile 4 -->
    <rect x="1420" y="278" width="424" height="118" fill="#EDF2F1"/>
    <text class="kpibig" x="1448" y="342">€120K</text>
    <text class="mono kpilbl" x="1448" y="366">IN 10 SIDECAR DINNERS</text>
    <text class="kpisub" x="1448" y="386">The highest-ROI line — protect it last</text>
  </g>

  <!-- ==================== LEFT CHART: SPEND BY MARKET ==================== -->
  <g id="chart-market">
    <text class="mono seclbl" x="76" y="452">NEW SPEND BY MARKET — WHERE THE €736K GOES</text>
    <line x1="76" y1="466" x2="912" y2="466" stroke="#C7D2D1" stroke-width="1"/>

    <!-- US -->
    <text class="barlbl" x="76"  y="512">United States</text>
    <text class="barsub" x="76"  y="530">9 events</text>
    <rect x="280" y="494" width="558" height="26" fill="#0B1416"/>
    <text class="barval" x="850" y="513">€419K</text>
    <text class="mono barsub" x="850" y="531" font-size="11">57%</text>

    <!-- DACH -->
    <text class="barlbl" x="76"  y="576">DACH</text>
    <text class="barsub" x="76"  y="594">6 events</text>
    <rect x="280" y="558" width="269" height="26" fill="#7E9290"/>
    <text class="barval" x="561" y="577">€202K</text>
    <text class="mono barsub" x="561" y="595" font-size="11">27%</text>

    <!-- Global / EU -->
    <text class="barlbl" x="76"  y="640">Global / EU</text>
    <text class="barsub" x="76"  y="658">2 events · Amsterdam, London</text>
    <rect x="280" y="622" width="153" height="26" fill="#9FB3B2"/>
    <text class="barval" x="445" y="641">€115K</text>
    <text class="mono barsub" x="445" y="659" font-size="11">16%</text>

    <line x1="76" y1="686" x2="912" y2="686" stroke="#E9EFEE" stroke-width="1"/>
    <text class="small" x="76" y="710">Market = city of the event. Committed spend (€105K) is US-only:</text>
    <text class="small" x="76" y="728">ProcureCon East Boston and ProcureCon West Las Vegas.</text>
  </g>

  <!-- ==================== RIGHT CHART: SPEND BY QUARTER ==================== -->
  <g id="chart-quarter">
    <text class="mono seclbl" x="1008" y="452">NEW SPEND BY QUARTER — THE Q2 CRUNCH</text>
    <line x1="1008" y1="466" x2="1844" y2="466" stroke="#C7D2D1" stroke-width="1"/>

    <!-- Q3 -->
    <text class="barlbl" x="1008" y="512">Q3-26</text>
    <text class="barsub" x="1008" y="530">65 days</text>
    <rect x="1150" y="494" width="246" height="26" fill="#7E9290"/>
    <text class="barval" x="1408" y="513">€165K</text>

    <!-- Q4 -->
    <text class="barlbl" x="1008" y="576">Q4-26</text>
    <text class="barsub" x="1008" y="594">32 days</text>
    <rect x="1150" y="558" width="130" height="26" fill="#7E9290"/>
    <text class="barval" x="1292" y="577">€87K</text>

    <!-- Q1 -->
    <text class="barlbl" x="1008" y="640">Q1-27</text>
    <text class="barsub" x="1008" y="658">31 days</text>
    <rect x="1150" y="622" width="161" height="26" fill="#7E9290"/>
    <text class="barval" x="1323" y="641">€108K</text>

    <!-- Q2 -->
    <text class="barlbl" x="1008" y="704">Q2-27</text>
    <text class="barsub" x="1008" y="722">76 days · 7 events</text>
    <rect x="1150" y="686" width="560" height="26" fill="#0B1416"/>
    <text class="barval" x="1722" y="705">€376K</text>

    <line x1="1008" y1="742" x2="1844" y2="742" stroke="#E9EFEE" stroke-width="1"/>
  </g>

  <!-- ==================== THE FINDING (sage band) ==================== -->
  <g id="finding">
    <rect x="76" y="772" width="1768" height="150" fill="#D6DBC5"/>
    <rect x="76" y="772" width="6" height="150" fill="#0B1416"/>

    <text class="mono seclbl" x="112" y="812">THE FINDING</text>
    <text class="stat" x="112" y="852">57% of the event spend chases the U.S. — the segment with no proven customer.</text>
    <text class="body" x="112" y="884">The calendar mirrors the TAM: the U.S. holds 52% of the addressable ARR and gets the most spend. It is also the one</text>
    <text class="body" x="112" y="906">market where no Lio customer is publicly verifiable. €929K is the price of turning that bet into booked meetings.</text>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g id="footer">
    <line x1="76" y1="1016" x2="1844" y2="1016" stroke="#C7D2D1" stroke-width="1"/>
    <text class="mono foot" x="76" y="1040">SOURCE: Lio_P1_Budget_Staffing.csv · 12-p1-budget-staffing.md · COMPILED 21 JUL 2026, REFRESHED 31 AUG 2026 · FIGURES ARE MID-RANGE PLANNING ENVELOPES, NOT ORGANIZER QUOTES · RANGE: €700K LEAN → €1.2M AGGRESSIVE</text>
    <text class="mono foot" x="1844" y="1040" text-anchor="end">5 / 11</text>
  </g>

</svg>
